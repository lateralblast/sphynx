# Larger TCP send buffers for HPN-SSH on long, fast network paths.
#
# This file is an example. It is installed under /usr/share/doc, not /etc, so
# it changes nothing until you choose to use it:
#
#   sudo cp /usr/share/doc/hpn-ssh/examples/99-hpn-ssh-tcp.conf /etc/sysctl.d/
#   sudo sysctl --system
#
# Why: the kernel never grows a connection's send buffer past the last number
# of net.ipv4.tcp_wmem, and the data a connection can have in flight is about
# that size. A path's capacity is its bandwidth times its round-trip time, so
# 1 Gbit/s at 100 ms holds about 12.5 MB. With a 4 MB maximum, which is the
# default on Ubuntu, a single connection cannot fill that path whatever SSH
# does. HPN-SSH grows its window to use a larger buffer; OpenSSH does not.
#
# Only the maximum changes. The first two numbers are the kernel defaults, and
# the kernel only grows a buffer for a connection that needs it.
#
# This is a system-wide setting: it applies to every program on the machine.
# Set it on both ends of the connection. The receive side, net.ipv4.tcp_rmem,
# is usually large enough already; check it with:
#
#   sysctl net.ipv4.tcp_rmem
#
# 32 MB (33554432) covers a 1 Gbit/s path up to about 200 ms. Use a larger
# value for faster or longer paths.
net.ipv4.tcp_wmem = 4096 16384 33554432
